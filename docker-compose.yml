app:
  build: .
  container_name: url-shortener-app
  ports:
    - "8080:8080"
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/url_shortener_db
    DB_USERNAME: postgres
    DB_PASSWORD: postgrespassword
    JWT_SECRET: ${JWT_SECRET:-change-this-to-a-very-long-random-secret-key-min-32-bytes}
  depends_on:
    postgres:
      condition: service_healthy