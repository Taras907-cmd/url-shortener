spring.application.name=url-shortener

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-min-32-bytes}
jwt.expiration-ms=86400000